postconf -e 'transport_maps = inline:{ alldanes@lists.sys.slush.ca=unwrap-relay:205.233.128.5:25 }, pgsql:/etc/postfix/pgsql-transport.cf, pgsql:/etc/postfix/pgsql-transport-mm.cf'


    # wrapped address -> original, for copies that must keep the poster's From
    - postconf -e 'unwrap_generic_maps = regexp:{ {/^(.+)=40([^@]+)@(dmarc\.ietf\.org|dmarc\.irtf\.org|dmarc\.rfc-editor\.org|dmarc\.iab\.org)$$/ $${1}@$${2}} }'
    # mailman's copies (LMTP)
    - postconf -e 'lmtp_generic_maps = $unwrap_generic_maps'
    # ignore-list copies: a relay transport that restores the From
    - postconf -M 'unwrap-relay/unix=unwrap-relay unix - - n - - smtp'
    - postconf -P 'unwrap-relay/unix/syslog_name=postfix/unwrap-relay'
    - postconf -P 'unwrap-relay/unix/smtp_generic_maps=$unwrap_generic_maps'
    # route each IGNORELIST address through it; the pgsql maps must stay as they are
    - postconf -e 'transport_maps = inline:{ alldanes@lists.sys.slush.ca=unwrap-relay:relay01.ietf.org:587 }, pgsql:/etc/postfix/pgsql-transport.cf, pgsql:/etc/postfix/pgsql-transport-mm.cf'


    unwrap_generic_maps = regexp:{ {/^(.+)=40([^@]+)@(dmarc\.sys\.slush\.ca|dmarc\.doot\.sys\.slush\.ca|dmarc\.poot\.sys\.slush\.ca)$$/ $${1}@$${2}} }
